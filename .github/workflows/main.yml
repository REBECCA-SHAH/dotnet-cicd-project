name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --no-restore

      - name: Run unit tests
        run: dotnet test --no-build

      - name: Publish application
        run: dotnet publish -c Release -o publish

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-output
          path: publish/

      - name: Basic security check (hardcoded secrets)
        shell: pwsh
        run: |
          $matches = Get-ChildItem -Recurse -Include *.cs | Select-String -Pattern "password"
          if ($matches) {
            Write-Error "Hardcoded password detected in source code"
          } else {
            Write-Output "No hardcoded secrets found"
          }
