# CI pipeline with tests and artifacts
name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore
                - name: Basic security check (hardcoded secrets)
        shell: bash
        run: |
          grep -R "password" --include="*.cs" . && exit 1 || echo "No hardcoded secrets found"

    - name: Build project
      run: dotnet build --no-restore


